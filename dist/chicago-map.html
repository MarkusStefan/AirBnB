<!DOCTYPE html><html lang="en"><head><script type="module" src="/chicago_neighborhoods.4cac08d0.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chicago Crime Evolution</title>
    <link rel="stylesheet" href="/chicago-map.4d663569.css">
</head>
<body>
    <div id="container">
        <div id="header">
            <h1>Chicago Crime Evolution</h1>
            <div id="subtitle">2018 - 2024</div>
        </div>

        <div id="viz-container">
            <svg id="map"></svg>

            <div id="legend">
                <h3>Crime Types</h3>
                <div class="legend-item crime-filter" data-type="HOMICIDE"><div class="legend-dot" style="background: #d32f2f"></div><span>Homicide</span></div>
                <div class="legend-item crime-filter" data-type="BATTERY"><div class="legend-dot" style="background: #f57c00"></div><span>Battery</span></div>
                <div class="legend-item crime-filter" data-type="ASSAULT"><div class="legend-dot" style="background: #fbc02d"></div><span>Assault</span></div>
                <div class="legend-item crime-filter" data-type="ROBBERY"><div class="legend-dot" style="background: #1976d2"></div><span>Robbery</span></div>
                <div class="legend-item crime-filter" data-type="BURGLARY"><div class="legend-dot" style="background: #7b1fa2"></div><span>Burglary</span></div>
                <div style="color: #666; margin-top: 10px; font-size: .8em">Click to filter</div>
                
                <hr style="border: 0; border-top: 1px solid #eee; margin: 15px 0">
                
                <h3>Controls</h3>
                <div class="control-item">
                    <label class="switch">
                        <input type="checkbox" id="density-toggle">
                        <span class="slider round"></span>
                    </label>
                    <span>Density View</span>
                </div>
                
                <div class="control-item" style="margin-top: 10px">
                    <button id="play-pause-btn">Pause</button>
                </div>
            </div>

            <div id="date-display">
                <div id="period-label">Loading...</div>
                <input type="range" id="time-slider" min="0" max="100" value="0" style="width: 100%; margin-top: 10px">
            </div>
        </div>
    </div>

    <script type="module" src="/chicago-map.46ca8e26.js"></script>


</body></html>
