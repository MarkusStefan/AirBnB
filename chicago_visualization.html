<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chicago AirBnB & Crime Evolution</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            overflow: hidden;
        }

        #container {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        #header {
            padding: 20px;
            text-align: center;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        #subtitle {
            font-size: 1.2em;
            opacity: 0.9;
        }

        #viz-container {
            flex: 1;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #map {
            width: 90%;
            height: 90%;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        #controls {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            padding: 20px 40px;
            border-radius: 50px;
            display: flex;
            align-items: center;
            gap: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        #play-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-size: 20px;
            cursor: pointer;
            transition: transform 0.2s;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        #play-btn:hover {
            transform: scale(1.1);
        }

        #timeline {
            width: 400px;
            height: 8px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            cursor: pointer;
            position: relative;
        }

        #timeline-progress {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            border-radius: 4px;
            width: 0%;
            transition: width 0.3s;
        }

        #period-label {
            font-size: 1.4em;
            font-weight: bold;
            min-width: 120px;
            text-align: center;
        }

        #legend {
            position: absolute;
            top: 100px;
            right: 40px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .legend-item {
            display: flex;
            align-items: center;
            margin: 10px 0;
            gap: 10px;
        }

        .legend-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }

        .airbnb-dot { background: #4CAF50; }
        .crime-dot { background: #F44336; }

        #stats {
            position: absolute;
            top: 100px;
            left: 40px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            min-width: 200px;
        }

        .stat-item {
            margin: 10px 0;
            font-size: 1.1em;
        }

        .stat-value {
            font-size: 1.8em;
            font-weight: bold;
            margin-top: 5px;
        }

        .airbnb-color { color: #4CAF50; }
        .crime-color { color: #F44336; }

        .point {
            cursor: pointer;
            transition: r 0.2s;
        }

        .tooltip {
            position: absolute;
            background: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 10px 15px;
            border-radius: 5px;
            pointer-events: none;
            font-size: 0.9em;
            display: none;
            z-index: 1000;
            max-width: 250px;
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.5em;
            text-align: center;
        }

        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="header">
            <h1>Chicago: AirBnB Rentals & Crime Evolution</h1>
            <div id="subtitle">Interactive Time-Series Visualization (2018-2024)</div>
        </div>

        <div id="viz-container">
            <div id="loading">
                <div class="spinner"></div>
                Loading data...
            </div>
            <svg id="map"></svg>

            <div id="legend" style="display: none;">
                <h3 style="margin-bottom: 15px;">Legend</h3>
                <div class="legend-item">
                    <div class="legend-dot airbnb-dot"></div>
                    <span>AirBnB Rental</span>
                </div>
                <div class="legend-item">
                    <div class="legend-dot crime-dot"></div>
                    <span>Homicide</span>
                </div>
            </div>

            <div id="stats" style="display: none;">
                <div class="stat-item">
                    <div>AirBnB Listings</div>
                    <div class="stat-value airbnb-color" id="airbnb-count">0</div>
                </div>
                <div class="stat-item">
                    <div>Crime Incidents</div>
                    <div class="stat-value crime-color" id="crime-count">0</div>
                </div>
            </div>

            <div id="controls" style="display: none;">
                <button id="play-btn">▶️</button>
                <div id="timeline">
                    <div id="timeline-progress"></div>
                </div>
                <div id="period-label">2018-01</div>
            </div>
        </div>

        <div class="tooltip" id="tooltip"></div>
    </div>

    <script>
        const width = window.innerWidth * 0.9;
        const height = window.innerHeight * 0.7;
        const margin = { top: 20, right: 20, bottom: 20, left: 20 };

        const svg = d3.select("#map")
            .attr("width", width)
            .attr("height", height);

        const mapGroup = svg.append("g").attr("class", "map-layer");
        const crimeGroup = svg.append("g").attr("class", "crime-layer");
        const airbnbGroup = svg.append("g").attr("class", "airbnb-layer");

        let currentPeriodIndex = 0;
        let isPlaying = false;
        let animationInterval = null;
        let data = null;

        d3.json("data/chicago_timeseries.json").then(loadedData => {
            data = loadedData;
            
            d3.select("#loading").style("display", "none");
            d3.select("#legend").style("display", "block");
            d3.select("#stats").style("display", "block");
            d3.select("#controls").style("display", "flex");

            const xScale = d3.scaleLinear()
                .domain([data.bounds.lon_min, data.bounds.lon_max])
                .range([margin.left, width - margin.right]);

            const yScale = d3.scaleLinear()
                .domain([data.bounds.lat_min, data.bounds.lat_max])
                .range([height - margin.bottom, margin.top]);

            mapGroup.append("rect")
                .attr("x", margin.left)
                .attr("y", margin.top)
                .attr("width", width - margin.left - margin.right)
                .attr("height", height - margin.top - margin.bottom)
                .attr("fill", "none")
                .attr("stroke", "rgba(255, 255, 255, 0.3)")
                .attr("stroke-width", 2);

            const tooltip = d3.select("#tooltip");

            function updateVisualization(periodIndex) {
                currentPeriodIndex = periodIndex;
                const period = data.periods[periodIndex];
                
                d3.select("#period-label").text(period);
                
                const progress = (periodIndex / (data.periods.length - 1)) * 100;
                d3.select("#timeline-progress").style("width", `${progress}%`);

                const airbnbPeriod = data.airbnb[periodIndex];
                const crimePeriod = data.crimes[periodIndex];

                d3.select("#airbnb-count").text(airbnbPeriod.count);
                d3.select("#crime-count").text(crimePeriod.count);

                const airbnbPoints = airbnbGroup
                    .selectAll(".airbnb-point")
                    .data(airbnbPeriod.locations, (d, i) => `${d.lat}-${d.lon}-${i}`);

                airbnbPoints.exit()
                    .transition()
                    .duration(300)
                    .attr("r", 0)
                    .attr("opacity", 0)
                    .remove();

                airbnbPoints.enter()
                    .append("circle")
                    .attr("class", "airbnb-point point")
                    .attr("cx", d => xScale(d.lon))
                    .attr("cy", d => yScale(d.lat))
                    .attr("r", 0)
                    .attr("fill", "#4CAF50")
                    .attr("opacity", 0)
                    .on("mouseover", function(event, d) {
                        d3.select(this)
                            .transition()
                            .duration(150)
                            .attr("r", d => Math.min(5 + (d.price / 100), 10));
                        
                        tooltip.style("display", "block")
                            .html(`
                                <strong>AirBnB Listing</strong><br>
                                Price: $${d.price.toFixed(0)}<br>
                                Type: ${d.room_type}<br>
                                Neighborhood: ${d.neighborhood}
                            `)
                            .style("left", (event.pageX + 10) + "px")
                            .style("top", (event.pageY - 10) + "px");
                    })
                    .on("mouseout", function(event, d) {
                        d3.select(this)
                            .transition()
                            .duration(150)
                            .attr("r", d => Math.min(3 + (d.price / 100), 8));
                        
                        tooltip.style("display", "none");
                    })
                    .merge(airbnbPoints)
                    .transition()
                    .duration(500)
                    .attr("r", d => Math.min(3 + (d.price / 100), 8))
                    .attr("opacity", 0.6);

                const crimePoints = crimeGroup
                    .selectAll(".crime-point")
                    .data(crimePeriod.locations, (d, i) => `${d.lat}-${d.lon}-${i}`);

                crimePoints.exit()
                    .transition()
                    .duration(300)
                    .attr("r", 0)
                    .attr("opacity", 0)
                    .remove();

                crimePoints.enter()
                    .append("circle")
                    .attr("class", "crime-point point")
                    .attr("cx", d => xScale(d.lon))
                    .attr("cy", d => yScale(d.lat))
                    .attr("r", 0)
                    .attr("fill", "#F44336")
                    .attr("opacity", 0)
                    .on("mouseover", function(event, d) {
                        d3.select(this)
                            .transition()
                            .duration(150)
                            .attr("r", 7);
                        
                        tooltip.style("display", "block")
                            .html(`
                                <strong>Crime Incident</strong><br>
                                Type: ${d.type}<br>
                                Description: ${d.description}
                            `)
                            .style("left", (event.pageX + 10) + "px")
                            .style("top", (event.pageY - 10) + "px");
                    })
                    .on("mouseout", function() {
                        d3.select(this)
                            .transition()
                            .duration(150)
                            .attr("r", 5);
                        
                        tooltip.style("display", "none");
                    })
                    .merge(crimePoints)
                    .transition()
                    .duration(500)
                    .attr("r", 5)
                    .attr("opacity", 0.7);
            }

            const playBtn = d3.select("#play-btn");
            
            playBtn.on("click", function() {
                isPlaying = !isPlaying;
                playBtn.text(isPlaying ? "⏸️" : "▶️");
                
                if (isPlaying) {
                    animationInterval = setInterval(() => {
                        currentPeriodIndex++;
                        if (currentPeriodIndex >= data.periods.length) {
                            currentPeriodIndex = 0;
                        }
                        updateVisualization(currentPeriodIndex);
                    }, 1000);
                } else {
                    clearInterval(animationInterval);
                }
            });

            d3.select("#timeline").on("click", function(event) {
                const rect = this.getBoundingClientRect();
                const x = event.clientX - rect.left;
                const percent = x / rect.width;
                const periodIndex = Math.floor(percent * data.periods.length);
                updateVisualization(Math.max(0, Math.min(periodIndex, data.periods.length - 1)));
            });

            updateVisualization(0);
            
            console.log("✅ Visualization loaded successfully!");
            console.log(`Periods: ${data.periods.length}`);
            console.log(`Range: ${data.periods[0]} to ${data.periods[data.periods.length - 1]}`);
        }).catch(error => {
            console.error("Error loading data:", error);
            d3.select("#loading").html(`
                <div style="color: #F44336;">
                    ❌ Error loading data<br>
                    <small>Make sure to run the notebook cell to generate data/chicago_timeseries.json</small>
                </div>
            `);
        });

        window.addEventListener('resize', () => {
            location.reload();
        });
    </script>
</body>
</html>
