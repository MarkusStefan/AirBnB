<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Chicago Crime Map</title>
    <link rel="stylesheet" href="style.css">
    <script type="importmap">
        {
            "imports": {
                "d3": "https://cdn.jsdelivr.net/npm/d3@7/+esm"
            }
        }
    </script>
</head>
<body>
    <div id="app-container">
        <div id="controls-panel">
            <h2>Controls</h2>
            
            <div class="control-group">
                <button id="play-pause-btn">Play</button>
                <input type="range" id="time-slider" min="0" max="100" value="0" step="1">
                <span id="date-display">Loading...</span>
            </div>

            <div class="control-group">
                <h3>View Mode</h3>
                <label>
                    <input type="radio" name="view-mode" value="scatter" checked> Scatter
                </label>
                <label>
                    <input type="radio" name="view-mode" value="density"> Density
                </label>
            </div>

            <div class="control-group">
                <h3>Opacity</h3>
                <input type="range" id="opacity-slider" min="0" max="1" step="0.1" value="0.5">
            </div>

            <div class="control-group">
                <h3>Crime Types</h3>
                <div id="crime-type-filters">
                </div>
            </div>
        </div>
        <div id="map-container"></div>
    </div>
    <script type="module" src="app.js"></script>
</body>
</html>
