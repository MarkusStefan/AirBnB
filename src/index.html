<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chicago Crime Evolution</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="loading-overlay" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 1000; display: flex; justify-content: center; align-items: center; flex-direction: column;">
        <div class="spinner" style="width: 50px; height: 50px; border: 5px solid #f3f3f3; border-top: 5px solid #2196F3; border-radius: 50%; animation: spin 1s linear infinite;"></div>
        <div style="margin-top: 20px; font-size: 18px; color: #555;">Loading Chicago Data...</div>
    </div>
    <style>
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>

    <div id="container">
        <div id="header">
            <h1>Chicago Crime Evolution</h1>
            <div id="subtitle">2018 - 2024</div>
        </div>

        <div id="viz-container">
            <svg id="map"></svg>

            <div id="legend">
                <h3>Crime Types</h3>
                <div class="legend-item crime-filter" data-type="HOMICIDE"><div class="legend-dot" style="background: #d32f2f;"></div><span>Homicide</span></div>
                <div class="legend-item crime-filter" data-type="BATTERY"><div class="legend-dot" style="background: #f57c00;"></div><span>Battery</span></div>
                <div class="legend-item crime-filter" data-type="ASSAULT"><div class="legend-dot" style="background: #fbc02d;"></div><span>Assault</span></div>
                <div class="legend-item crime-filter" data-type="ROBBERY"><div class="legend-dot" style="background: #1976d2;"></div><span>Robbery</span></div>
                <div class="legend-item crime-filter" data-type="BURGLARY"><div class="legend-dot" style="background: #7b1fa2;"></div><span>Burglary</span></div>
                <div style="margin-top: 10px; font-size: 0.8em; color: #666;">Click to filter</div>
                
                <hr style="border: 0; border-top: 1px solid #eee; margin: 15px 0;">
                
                <h3>Controls</h3>
                <div class="control-item">
                    <label class="switch">
                        <input type="checkbox" id="density-toggle">
                        <span class="slider round"></span>
                    </label>
                    <span>Density View</span>
                </div>

                <div id="opacity-controls" style="margin-top: 5px;">
                    <div class="control-item" id="density-opacity-control" style="display: none; flex-direction: column; align-items: flex-start;">
                        <label for="density-opacity-slider" style="font-size: 0.9em; color: #666; margin-bottom: 2px;">Density Opacity</label>
                        <input type="range" id="density-opacity-slider" min="0" max="1" step="0.01" value="0.3" style="width: 100%;">
                    </div>
                    <div class="control-item" id="point-opacity-control" style="display: flex; flex-direction: column; align-items: flex-start;">
                        <label for="point-opacity-slider" style="font-size: 0.9em; color: #666; margin-bottom: 2px;">Point Opacity</label>
                        <input type="range" id="point-opacity-slider" min="0" max="1" step="0.01" value="0.7" style="width: 100%;">
                    </div>
                </div>
                
                <div class="control-item" style="margin-top: 10px;">
                    <button id="play-pause-btn">Pause</button>
                </div>
            </div>

            <div id="date-display">
                <div id="period-label">Loading...</div>
                <input type="range" id="time-slider" min="0" max="100" value="0" style="width: 100%; margin-top: 10px;">
            </div>
        </div>
    </div>

    <script type="module" src="visualization.js"></script>
</body>
</html>
